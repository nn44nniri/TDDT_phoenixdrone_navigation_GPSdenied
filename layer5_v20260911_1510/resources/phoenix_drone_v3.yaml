      servo_output: 1
      ardupilot_function: 77
      role: elevon_left
      min_deg: -30.36676314193363
      max_deg: 30.36676314193363
      trim_deg: 0.0
      joint_limit_rad: 0.53
      limit_provenance: source_identified_official_phoenix_sdf
    right_elevon:
      servo_output: 2
      ardupilot_function: 78
      role: elevon_right
      min_deg: -30.36676314193363
      max_deg: 30.36676314193363
      trim_deg: 0.0
      joint_limit_rad: 0.53
      limit_provenance: source_identified_official_phoenix_sdf
  motors:
    left_motor:
      servo_output: 3
      ardupilot_function: 73
      role: throttle_left
      min_norm: 0.0
      max_norm: 1.0
    right_motor:
      servo_output: 4
      ardupilot_function: 74
      role: throttle_right
      min_norm: 0.0
      max_norm: 1.0
  logical_control_input:
    roll: aileron_norm [-1,+1]
    pitch: elevator_norm [-1,+1]
    throttle: throttle_norm [0,1]
    yaw: rudder_norm [-1,+1]
  mixing_note: ArduPilot performs elevon mixing and optional differential-thrust yaw; pt_lib sends pilot-domain
    roll/pitch/throttle/yaw, not direct motor RPM.
autopilot_runtime:
  vehicle: ArduPlane
  parameters:
    SERVO1_FUNCTION: 77
    SERVO2_FUNCTION: 78
    SERVO3_FUNCTION: 73
    SERVO4_FUNCTION: 74
    SERVO1_MIN: 1000
    SERVO1_TRIM: 1500
    SERVO1_MAX: 2000
    SERVO2_MIN: 1000
    SERVO2_TRIM: 1500
    SERVO2_MAX: 2000
    SERVO3_MIN: 1000
    SERVO3_TRIM: 1000
    SERVO3_MAX: 2000
    SERVO4_MIN: 1000
    SERVO4_TRIM: 1000
    SERVO4_MAX: 2000
    RUDD_DT_GAIN: 0.0
    AHRS_EKF_TYPE: 10
    ARSPD_TYPE: 100
    BATT_MONITOR: 4
    BATT_CAPACITY: 2200
    TERRAIN_ENABLE: 0
    TERRAIN_FOLLOW: 0
  parameter_provenance:
    servo_functions: ArduPlane documented elevon/twin-throttle output functions
    RUDD_DT_GAIN: kept disabled in the current ArduPlane controller configuration; JSBSim physical plant contains
      differential-thrust yaw authority, validated independently at the plant level
    AHRS_EKF_TYPE: SITL-only simulator attitude backend; do not transfer blindly to real hardware
    ARSPD_TYPE: SITL-only simulator airspeed backend so JSON airspeed is used consistently
    BATT_MONITOR: SITL integration battery monitor enabled so JSON bridge voltage/current are observable
    BATT_CAPACITY: Phoenix profile capacity in mAh; telemetry model remains integration-only
    TERRAIN_ENABLE: disabled because ArduPilot terrain-follow requires its own matching terrain database; the supplied
      DEM is coupled to JSBSim physics in v0.6.0
    TERRAIN_FOLLOW: disabled until a validated terrain data source is explicitly provided
  controller_scope: ArduPlane fixed-wing control authority; JSBSim physical plant additionally models bounded VTOL
    low-speed/transition forces
  vtol_autopilot_controller_validated: false
  vtol_autopilot_note: This release validates the VTOL physical plant, not a complete autonomous ArduPilot tailsitter
    hover/transition controller.
simulation_assumptions:
  jsbsim_model_fidelity: source_informed_vtol_integration_model
  jsbsim_aircraft_model: phoenix_v3_vtol
  forward_flight_air_start_only: false
  tailsitter_hover_transition_validated: bounded_simulation_envelope_pass
  source_identified_data:
  - base-link inertia and inertial pose
  - motor time constants/max speed/thrust constant/moment constant
  - calibrated Gazebo propwash aerodynamic coefficients and CP locations
  engineering_estimates_still_required:
  - high-angle and low-speed aerodynamic reduction used by phoenix_v3_vtol XML
  - propwash control-authority coefficients used for bounded low-speed VTOL integration
  - JSBSim coordinate-frame reduction of the full Gazebo geometry
  - forward-flight cruise trim control values
  initial_agl_m: 0.141025821708132
  home_alt_msl_m_default: 0.0
  home_alt_source: runtime terrain start sample
  confidence: source_informed_vtol_integration_model_not_real_aircraft_flight_validated
  validation_boundary: Simulation-level VTOL force/control-authority plus bounded low-speed transition validation;
    not real-aircraft flight identification and not a complete autonomous ArduPilot tailsitter controller.
  analytic_release_seed:
    airspeed_m_s: 13.5
    alpha_deg: 8.8
    elevator_norm: -0.15
    collective_throttle_norm: 0.3
    fidelity: engineering_equilibrium_seed_using_source_inertia_motor_law_and_estimated_forward_flight_derivatives
    validation: not_measured_trim; FMI JSBSim runtime readiness/supervision remains authoritative
  vtol_force_model_validated: true
  hover_equilibrium_validation: analytic_force_balance_pass
  true_zero_speed_90deg_hover_dynamic_validated: false
  real_aircraft_flight_validated: false
  dynamic_vtol_validation:
