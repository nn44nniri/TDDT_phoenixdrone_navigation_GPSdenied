[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tddt-dynamic-ntwin-layer5"
version = "2026.9.11.1510"
description = "ERA-qLPV-MPC Layer 5 decision, safety, runtime assurance and PhoenixDrone specialization for TDDT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.scripts]
tddt-layer5 = "layer5.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
