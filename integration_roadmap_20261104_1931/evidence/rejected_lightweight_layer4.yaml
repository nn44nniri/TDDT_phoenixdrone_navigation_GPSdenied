package:
  version: 2026.9.7.0608
  architecture: Lightweight Edge Layer 4 / DNCC-qLPV
paths:
  TDDT_TWINS_ROOT: ''
  TDDT_CLIMATE_ROOT: ''
  TDDT_TDOC_ROOT: ''
  TDDT_SARG_PACKAGE_ROOT: ''
  TDDT_BOULDER_ROOT: ''
  TDDT_LAYER3_ROOT: ''
  TDDT_SARG_ROOT: ''
  TDDT_CRP_ROOT: ''
  TDDT_MAP_ROOT: ''
edge:
  dt_s: 1.0
  # Native prototype: three full forecast steps plus the separate 0.1 s commit.
  # Every selected step still passes the existing Full-Fidelity/safety gates.
  horizon: 3
  horizon_max: 12
  reduced_scenarios: 3
  reduced_scenarios_max: 12
  max_topology_modes: 4
  max_uq_dim: 9
  rom_rank_max: 10
  deim_points_max: 10
  top_k_ff_max: 3
  cpu_budget_ms: 1800.0
  memory_budget_mb: 192.0
  memory_sample_interval_ms: 10.0
  energy_budget_j: 50.0
  raw_scenarios_max: 2048
  estimated_cpu_power_w: 8.0
snapshot:
  require_atomic_kind: true
  require_boundary: true
  allow_missing_declared_hash: true
  hash_algorithm: sha256
knowledge:
  consume_layer3_guidance_first: true
  validate_external_sarg_crp: true
  use_direct_dataset_only_for_prior_and_provenance: true
scenario:
  templates_file: resources/scenario_templates.json
  topology_file: resources/topology_dfa.json
  distance_weights:
    action: 1.0
    disturbance: 0.6
    degradation: 1.2
    topology: 1.5
  ood_probability_boost: 1.5
  topology_change_step: 1
  reduction_swap_iterations: 2
  reduction_swap_pool: 64
  reduction_cache_entries: 8
trust:
  forgetting_factor: 0.96
  epsilon_u: 1.0e-06
  eta_reference: 1.0
  alpha0: 2.0
  beta0: 1.0
  freshness_decay_per_s:
    default: 0.02
    MESA_NAV: 0.02
    WingMPET: 0.02
    MicroMetTwin: 0.0005555555555555556
  uncertainty_growth_per_s: 0.01
coupling:
  forgetting_factor: 0.98
  initial_covariance: 10.0
  default_bounds:
  - 0.0
  - 1.0
  scenario_delta_decay: 0.95
qlpv:
  model_file: resources/edge_model/qlpv_model.npz
  metadata_file: resources/edge_model/qlpv_model.json
  action_dim: 5
  disturbance_dim: 6
  state_schema_file: resources/state_schema.json
  optimizer_iterations: 10
  optimizer_step: 0.02
  action_lower:
  - -0.25
  - -0.25
  - -0.15
  - -0.15
  - -2.0
  action_upper:
  - 0.25
  - 0.25
  - 0.15
  - 0.15
  - 2.0
  q_state: 0.03
  r_action: 0.15
  q_terminal: 0.06
robust:
  tube_radius0: 0.02
  disturbance_radius: 0.03
  feedback_gain_scale: 0.08
  tube_radius_max: 20.0
  terminal_period: 2
  terminal_contraction_ratio_max: 1.0
  terminal_dynamic_states:
  - Vg_0
  - Vg_1
  - Vg_2
  - Va_0
  - Va_1
  - Va_2
  - airspeed_m_s
  - W_0
  - W_1
  - W_2
  require_terminal_certificate: true
  terminal_radius_max: 25.0
uq:
  enabled: true
  affine_default: true
  model_inflation: 1.25
  process_noise_diag: 0.0004
  active_ordering:
  - Vg_N
  - Vg_E
  - Vg_D
  - Va_N
  - Va_E
  - Va_D
  - W_N
  - W_E
  - W_D
consistency:
  regularizer: 1.0e-08
  constraint_lambda: 20.0
  j_c_max: 25.0
  mu_min: -1.0
  mu_target: 0.25
  default_edge_tolerance: 5.0
  hard_velocity_triangle: true
feasibility:
  min_twin_validity: 0.2
  min_airspeed_m_s: 9.1
  max_airspeed_m_s: 18.0
  min_terrain_clearance_m: 30.0
  max_abs_wind_m_s: 8.0
  alpha_risk: 0.1
  min_obstacle_clearance_m: 10.0
  risk_max: 1.0
objectives:
  discount: 0.98
  normalization:
    mission:
    - 0.0
    - 2000.0
    time:
    - 0.0
    - 30.0
    energy:
    - 0.0
    - 50.0
    risk:
    - 0.0
    - 10.0
    uncertainty:
    - 0.0
    - 5000.0
    consistency:
    - 0.0
    - 100.0
    margin:
    - 0.0
    - 20.0
  degradation_risk_weight: 1.0
  non_nominal_disturbance_risk: 0.15
  scalarization_weights:
    mission: 0.22
    time: 0.1
    energy: 0.13
    risk: 0.2
    uncertainty: 0.12
    consistency: 0.13
    margin: 0.1
  mission_stage_gain: 0.15
  mission_terminal_gain: 1.0
  time_speed_floor_m_s: 1.0
  dynamic_risk_weight: 0.5
rom:
  enabled: true
  basis_file: resources/rom/pod_basis.npz
  metadata_file: resources/rom/pod_metadata.json
  error_tolerance: 5.0
  validity_radius: 100000.0
verification:
  enabled: true
  mode: layer3_runtime_if_available
  top_k: 2
  objective_tolerance: 1000.0
  request_template: examples/layer3_runtime_request_template.json
  strict_verified_label: true
  # Shared OFFLINE/ONLINE FF-surrogate calibration.  Native vertical-flight
  # replay is less risky than the conservative surrogate at phase entry; retain
  # the symmetric objective-consistency gate while covering the evidenced
  # normalized delta (~2.72).  Physical, chance, twin and stability gates remain
  # independently fail-closed.
  objective_tolerance_normalized: 3.0
  certificate_reuse_enabled: true
  certificate_bank_path: runtime/verification/ff_certificates.jsonl
  certificate_freshness_s: 300.0
  certificate_state_tolerance: 0.05
  certificate_action_tolerance: 0.01
  certificate_freshness_clock: mission_reference
  certificate_state_sigma_multiplier: 3.0
  certificate_action_range_fraction: 0.05
registry:
  path: runtime/candidates/candidates.jsonl
  provenance_path: runtime/provenance.jsonl
vtol:
  mode_from_context_keys:
  - flight_mode
  - stage
  - stage_id
  min_airspeed_by_mode_m_s:
    hover: 0.0
    takeoff: 0.0
    transition: 3.0
    cruise: 9.1
    landing: 0.0
  # Priority-1 v2: phase-aware terrain semantics. The en-route 30 m floor
  # remains unchanged for wing-borne/transition phases.
  vertical_takeoff_min_agl_m: 0.0
  vertical_takeoff_max_downward_excursion_m: 0.25
  vertical_takeoff_corridor_tolerance_m: 2.0
  hover_min_agl_m: 0.0
  hover_agl_tolerance_m: 3.0
  # Problem #24: ground-referenced terminal corridor.  These values do
  # not relax en-route terrain clearance for any other phase.
  vertical_landing_min_agl_m: 0.0
  vertical_landing_max_upward_excursion_m: 1.0
pareto:
  explicit_regions_file: resources/pareto/explicit_regions.json
  fallback_online_nd: true
optimization:
  enabled: true
  solver: bounded_deterministic_spsa_augmented_lagrangian
  iterations: 3
  step: 0.1
  perturbation: 0.035
  step_decay: 0.602
  perturbation_decay: 0.101
  gradient_clip: 3.0
  robust_scenarios: 3
  robust_worst_case_weight: 0.8
  constraint_penalty: 40.0
  chance_penalty: 80.0
  terminal_penalty: 100.0
