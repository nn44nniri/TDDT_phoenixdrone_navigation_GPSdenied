[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tddt-dynamic-ntwin-layer3"
version = "2026.9.11.1131"
description = "Python implementation of TDDT Dynamic N-Twin Layer 3 with a shared Center of Consistency"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "pyproj>=3.5",
  "pandas>=2.0",
  "shapely>=2.0",
  "plotly>=6.0"
]

[project.scripts]
tddt-layer3 = "layer3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
