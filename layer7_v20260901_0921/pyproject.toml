[build-system]
requires = []
build-backend = "tddt_build_backend"
backend-path = ["."]

[project]
name = "tddt-layer7"
version = "0.3.0"
description = "Edge-oriented Gaussian/Bayesian error-feedback and safe-adaptation side module for TDDT Layer 7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pytest>=7.0",
]
authors = [{name = "TDDT Layer 7 implementation"}]

[project.scripts]
tddt-layer7 = "tddt_layer7.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
